<!DOCTYPE html>
<html lang="en">
<head>

  <script>
    // When opened directly from file/drive without a web server, seamlessly switch to self-contained standalone bundle
    if (window.location.protocol === 'file:' && !window.location.pathname.endsWith('standalone.html')) {
      window.location.replace('standalone.html' + (window.location.hash || '#/login'));
    }
  </script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Lottie Animation Web Player CDN -->

  <!-- Custom Atlassian Design System Tokens & ERP Styles -->
  <link rel="stylesheet" href="css/app.css" />
  <style>
    /* Strict Flat Design - Zero Drop Shadows and Zero Gradients */
    *, *::before, *::after {
      box-shadow: none !important;
      text-shadow: none !important;
    }
    [class*="bg-gradient-"] {
      background-image: none !important;
    }

    /* Single clean native date picker icon - suppress duplicate SVG date icon across entire application */
    .erp-date-icon {
      display: none !important;
    }
    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="datetime-local"]::-webkit-calendar-picker-indicator,
    input[type="month"]::-webkit-calendar-picker-indicator {
      cursor: pointer !important;
      opacity: 0.75 !important;
    }
    input[type="date"]::-webkit-calendar-picker-indicator:hover {
      opacity: 1 !important;
    }

    /* Date Inputs - show DD-MM-YYYY in uppercase across all WebKit/Chromium date fields */
    input[type="date"],
    input[type="datetime-local"],
    input[type="month"],
    .erp-date-input {
      text-transform: uppercase !important;
    }
    input[type="date"]::-webkit-datetime-edit,
    input[type="date"]::-webkit-datetime-edit-fields-wrapper,
    input[type="date"]::-webkit-datetime-edit-text,
    input[type="date"]::-webkit-datetime-edit-month-field,
    input[type="date"]::-webkit-datetime-edit-day-field,
    input[type="date"]::-webkit-datetime-edit-year-field,
    input[type="datetime-local"]::-webkit-datetime-edit,
    input[type="datetime-local"]::-webkit-datetime-edit-fields-wrapper,
    input[type="datetime-local"]::-webkit-datetime-edit-text,
    input[type="datetime-local"]::-webkit-datetime-edit-month-field,
    input[type="datetime-local"]::-webkit-datetime-edit-day-field,
    input[type="datetime-local"]::-webkit-datetime-edit-year-field,
    input[type="month"]::-webkit-datetime-edit,
    input[type="month"]::-webkit-datetime-edit-fields-wrapper,
    input[type="month"]::-webkit-datetime-edit-text,
    input[type="month"]::-webkit-datetime-edit-month-field,
    input[type="month"]::-webkit-datetime-edit-year-field,
    .erp-date-input::-webkit-datetime-edit,
    .erp-date-input::-webkit-datetime-edit-fields-wrapper,
    .erp-date-input::-webkit-datetime-edit-text,
    .erp-date-input::-webkit-datetime-edit-month-field,
    .erp-date-input::-webkit-datetime-edit-day-field,
    .erp-date-input::-webkit-datetime-edit-year-field {
      text-transform: uppercase !important;
    }

    /* Active Tab: Text button with active line below */
    .tab-active,
    a.tab-active,
    a.tab-active:visited,
    a[role="tab"][aria-selected="true"],
    [role="tab"][aria-selected="true"] {
      background-color: transparent !important;
      background: transparent !important;
      color: #00A4B7 !important;
      border-radius: 0 !important;
      border-top: none !important;
      border-left: none !important;
      border-right: none !important;
      border-bottom: 2px solid #00A4B7 !important;
      font-weight: 700 !important;
      user-select: none !important;
      -webkit-user-select: none !important;
      box-shadow: none !important;
      margin-bottom: -1px !important;
    }
    .tab-active *,
    a.tab-active *,
    [role="tab"][aria-selected="true"] *,
    [role="tab"][aria-selected="true"] span {
      background-color: transparent !important;
      color: #00A4B7 !important;
      font-weight: 700 !important;
      user-select: none !important;
      -webkit-user-select: none !important;
    }
    [role="tab"] {
      border-radius: 0 !important;
      border-top: none !important;
      border-left: none !important;
      border-right: none !important;
      border-bottom: 2px solid transparent !important;
      user-select: none !important;
      -webkit-user-select: none !important;
      transition: all 0.15s ease-in-out !important;
      margin-bottom: -1px !important;
    }
    [role="tab"]:not([aria-selected="true"]):not(.tab-active):hover {
      background-color: transparent !important;
      color: #172B4D !important;
      border-bottom: 2px solid transparent !important;
    }
    [role="tab"]:focus:not(:focus-visible) {
      outline: none !important;
      box-shadow: none !important;
    }

    /* Dropdown Search Input UI */
    .erp-dropdown-search-wrapper {
      background-color: #F8FAFC !important;
      border-bottom: 1px solid #E2E8F0 !important;
      padding: 8px !important;
    }
    #erp-dropdown-search-input {
      min-height: 32px !important;
      height: 32px !important;
      padding: 4px 10px 4px 30px !important;
      font-size: 12px !important;
      line-height: 20px !important;
      border-radius: 6px !important;
      border: 1px solid #CBD5E1 !important;
      background-color: #FFFFFF !important;
      color: #0F172A !important;
      box-shadow: none !important;
      width: 100% !important;
      text-transform: none !important;
    }
    #erp-dropdown-search-input:hover {
      border-color: #94A3B8 !important;
    }
    #erp-dropdown-search-input:focus {
      border-color: #00A4B7 !important;
      box-shadow: 0 0 0 2px rgba(0, 164, 183, 0.15) !important;
      outline: none !important;
    }
    #erp-dropdown-search-input::placeholder {
      color: #94A3B8 !important;
      font-size: 12px !important;
      font-weight: 400 !important;
      text-transform: none !important;
    }
    /* Calendar Header Navigation Buttons & Visible Chevrons */
    .erp-cal-header {
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      padding-bottom: 8px !important;
      margin-bottom: 8px !important;
      border-bottom: 1px solid #E2E8F0 !important;
    }
    #erp-cal-prev-btn,
    #erp-cal-next-btn {
      width: 28px !important;
      min-width: 28px !important;
      max-width: 28px !important;
      height: 28px !important;
      min-height: 28px !important;
      max-height: 28px !important;
      padding: 0 !important;
      margin: 0 !important;
      border-radius: 9999px !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      background-color: transparent !important;
      background: transparent !important;
      border: 1px solid #E2E8F0 !important;
      color: #334155 !important;
      cursor: pointer !important;
      box-shadow: none !important;
      transition: all 0.15s ease !important;
      outline: none !important;
    }
    #erp-cal-prev-btn:hover,
    #erp-cal-next-btn:hover {
      background-color: #F1F5F9 !important;
      color: #00A4B7 !important;
      border-color: #00A4B7 !important;
    }
    #erp-cal-prev-btn svg,
    #erp-cal-next-btn svg {
      width: 16px !important;
      min-width: 16px !important;
      max-width: 16px !important;
      height: 16px !important;
      min-height: 16px !important;
      max-height: 16px !important;
      display: block !important;
      stroke: #334155 !important;
      stroke-width: 2.5 !important;
      stroke-linecap: round !important;
      stroke-linejoin: round !important;
      fill: none !important;
      pointer-events: none !important;
      opacity: 1 !important;
      visibility: visible !important;
    }
    #erp-cal-prev-btn:hover svg,
    #erp-cal-next-btn:hover svg {
      stroke: #00A4B7 !important;
    }
    #erp-cal-clear-btn,
    #erp-cal-today-btn {
      min-height: 26px !important;
      height: 26px !important;
      padding: 2px 10px !important;
      font-size: 11px !important;
      border-radius: 6px !important;
      box-shadow: none !important;
      cursor: pointer !important;
    }
    #erp-cal-clear-btn {
      background: transparent !important;
      border: 1px solid transparent !important;
      color: #64748B !important;
    }
    #erp-cal-clear-btn:hover {
      background: #FEE2E2 !important;
      color: #EF4444 !important;
    }
    #erp-cal-today-btn {
      background: #E6F7F9 !important;
      border: 1px solid transparent !important;
      color: #00A4B7 !important;
      font-weight: 700 !important;
    }
    #erp-cal-today-btn:hover {
      background: #CFF0F4 !important;
      color: #008796 !important;
    }

    /* Filter Bar Action Buttons: show only icon by default, reveal text on hover */
    .dt-top-filter-reset-btn,
    .dt-top-filter-toggle-btn,
    #comm-filter-reset-btn,
    #comm-filter-toggle-btn,
    #bill-top-reset-btn,
    #bill-top-toggle-btn {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      min-height: 31px !important;
      min-width: 31px !important;
      padding: 6px 8px !important;
      overflow: hidden !important;
      white-space: nowrap !important;
      cursor: pointer !important;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    .dt-top-filter-reset-btn > span,
    .dt-top-filter-toggle-btn .dt-top-filter-toggle-text,
    #comm-filter-reset-btn > span,
    #comm-filter-toggle-btn .comm-toggle-text,
    .rm-toggle-text {
      max-width: 0 !important;
      opacity: 0 !important;
      overflow: hidden !important;
      display: inline-block !important;
      vertical-align: middle !important;
      white-space: nowrap !important;
      margin-left: 0 !important;
      pointer-events: none !important;
      transition: max-width 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease, margin 0.2s ease !important;
    }

    .dt-top-filter-reset-btn:hover > span,
    .dt-top-filter-reset-btn:focus-visible > span,
    .dt-top-filter-toggle-btn:hover .dt-top-filter-toggle-text,
    .dt-top-filter-toggle-btn:focus-visible .dt-top-filter-toggle-text,
    #comm-filter-reset-btn:hover > span,
    #comm-filter-reset-btn:focus-visible > span,
    #comm-filter-toggle-btn:hover .comm-toggle-text,
    #comm-filter-toggle-btn:focus-visible .comm-toggle-text,
    button:hover > .rm-toggle-text,
    button:focus-visible > .rm-toggle-text {
      max-width: 100px !important;
      opacity: 1 !important;
      margin-left: 6px !important;
    }
    /* Primary & Filter Search Buttons - Zero Border */
    .btn-primary,
    button.btn-primary,
    .dt-top-filter-search-btn,
    button.dt-top-filter-search-btn,
    button[id*="search-btn"],
    button[id$="-search-btn"],
    .dt-top-filter-reset-btn,
    .dt-top-filter-toggle-btn {
      border: none !important;
      border-width: 0 !important;
      border-style: none !important;
      border-color: transparent !important;
      outline: none !important;
    }
    .btn-primary:hover,
    .btn-primary:focus,
    .btn-primary:active,
    .dt-top-filter-search-btn:hover,
    .dt-top-filter-search-btn:focus,
    .dt-top-filter-search-btn:active,
    .dt-top-filter-reset-btn:hover,
    .dt-top-filter-toggle-btn:hover {
      border: none !important;
      border-color: transparent !important;
      outline: none !important;
    }

    /* Secondary Buttons, Modal Buttons (e.g. Cancel), Download & Column Visibility Buttons - Clean 1px Border */
    .btn-secondary,
    button.btn-secondary,
    [type="button"].btn-secondary,
    #modal-btn-0,
    button[id^="modal-btn-"]:not(.btn-primary):not(.btn-danger),
    #dt-download-btn,
    #dt-columns-btn,
    button#dt-download-btn,
    button#dt-columns-btn,
    .btn-outline,
    button.btn-outline,
    button.border,
    button[class*="border-[#CBD5E1]"],
    button[class*="border-[#DFE1E6]"],
    button.border-neutral-300 {
      border: 1px solid #CBD5E1 !important;
      border-color: #CBD5E1 !important;
      background-color: #FFFFFF !important;
      color: #172B4D !important;
      outline: none !important;
    }
    .btn-secondary:hover,
    button.btn-secondary:hover,
    [type="button"].btn-secondary:hover,
    #modal-btn-0:hover,
    button[id^="modal-btn-"]:not(.btn-primary):not(.btn-danger):hover,
    #dt-download-btn:hover,
    #dt-columns-btn:hover,
    button#dt-download-btn:hover,
    button#dt-columns-btn:hover,
    .btn-outline:hover,
    button.btn-outline:hover,
    button.border:hover,
    button[class*="border-[#CBD5E1]"]:hover,
    button[class*="border-[#DFE1E6]"]:hover,
    button.border-neutral-300:hover {
      border: 1px solid #94A3B8 !important;
      border-color: #94A3B8 !important;
      background-color: #F8FAFD !important;
      color: #0F172A !important;
      outline: none !important;
    }
  
/* Master Setup Accordion Smooth Transitions */
.master-accordion-card {
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

.master-accordion-header {
  transition: background-color 0.2s ease, border-color 0.2s ease;
}

.animate-accordion-expand,
.master-accordion-body {
  animation: accordionFadeSlide 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

@keyframes accordionFadeSlide {
  from {
    opacity: 0;
    transform: translateY(-8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

  
/* Master Setup Tables - Hide DataTable Toolbar Header per user instruction */
#master-records-table-container .bg-\[\#FAFBFC\].border-b.border-\[\#DFE1E6\],
#master-records-table-container div:has(> #dt-download-btn),
#master-records-table-container div:has(> #dt-columns-btn) {
  display: none !important;
}

  </style>
</head>
<body class="bg-[#F2F5F9] text-[#0F172A] antialiased overflow-x-hidden min-h-screen">

  <div id="app-root"></div>

  <!-- Boot Module -->
  <script type="module" src="js/app.js"></script>
